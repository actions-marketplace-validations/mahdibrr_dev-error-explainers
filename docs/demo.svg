<text x="400" y="19" text-anchor="middle" class="t">bash — dev-error-explainers 0.1.0</text>
<g class="fa"><text x="20" y="58"><tspan class="p">$</tspan> <tspan>docker run --rm -v $PWD:/app node:18.17.0 node /app/index.js</tspan></text><g class="err"><text x="20" y="77" class="o">/app/index.js:1</text><text x="20" y="96" class="o">const fetch = require('node-fetch');</text><text x="20" y="115" class="o">              ^</text><text x="20" y="134" class="o"></text><text x="20" y="153" class="o">Error [ERR_REQUIRE_ESM]: require() of ES Module /app/node_modules/node-fetch/src/index.js fro…</text><text x="20" y="172" class="o">Instead change the require of /app/node_modules/node-fetch/src/index.js in /app/index.js to a…</text><text x="20" y="191" class="o">    at Object.&lt;anonymous&gt; (/app/index.js:1:15) {</text><text x="20" y="210" class="o">  code: 'ERR_REQUIRE_ESM'</text><text x="20" y="229" class="o">}</text><text x="20" y="248" class="o"></text><text x="20" y="267" class="o">Node.js v18.17.0</text><text x="20" y="290"><tspan class="p">$</tspan></text><text x="35.6" y="290" textLength="717.6" lengthAdjust="spacing">docker run --rm -v $PWD:/app node:18.17.0 node /app/index.js 2&gt;&amp;1 | npx dev-error-explainers</text>
<rect class="cover" x="34.6" y="277" width="731.6" height="19" fill="#0d1117"/>
<rect class="cur" x="35.6" y="278" width="7.8" height="16" fill="#c9d1d9" opacity=".8"/></g></g>
<g class="fb"><text x="20" y="58"><tspan class="p">$</tspan> <tspan>docker run --rm -v $PWD:/app node:18.17.0 node /app/index.js 2&gt;&amp;1 | npx dev-error-explainers</tspan></text><text x="20" y="77" class="h">== ESM / CommonJS (esm-cjs-explainer) ==</text><text x="20" y="115" class="b">1. ERR_REQUIRE_ESM — require() of an ES module</text><text x="20" y="134">   Cause: A CommonJS file called require() on /app/node_modules/node-fetch/src/index.js, whic…</text><text x="20" y="153">   Why: Before require(esm) was enabled by default, Node.js refused to require() an ES module…</text><text x="20" y="172">   Fixes:</text><text x="20" y="191">     1) Upgrade Node.js (you are on 18.17.0) — require() loads synchronous ES modules by defa…</text><text x="20" y="210" class="g">         nvm install 22   # any 22.12.0+ or 20.19.0+ works</text><text x="20" y="229" class="g">         node -p "process.features.require_module"   # true</text><text x="20" y="248">     2) Use dynamic import() from CommonJS — import() is valid inside CommonJS on every suppo…</text><text x="20" y="267" class="g">         const { default: pkg } = await import('node-fetch');</text><text x="20" y="286">     3) Convert the calling file to ESM — Rename it to .mjs, or add "type": "module" to your…</text><text x="20" y="305" class="g">         import pkg from 'node-fetch';</text><text x="20" y="324" class="d">   Source: https://nodejs.org/api/modules.html#loading-ecmascript-modules-using-require</text></g>
</svg>