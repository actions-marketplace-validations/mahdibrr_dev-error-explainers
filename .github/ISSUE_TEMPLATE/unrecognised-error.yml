name: Unrecognised error
description: An error that one of the explainers should recognise but does not.
title: "Unrecognised: "
labels: ["unrecognised-error"]
body:
  - type: markdown
    attributes:
      value: |
        A new rule is only added with a test built from a **real** error, so the exact text matters more than anything else.
        Mask secrets (tokens, passwords, cookies) yourself before pasting — replace them, do not delete the line.
  - type: dropdown
    id: module
    attributes:
      label: Which explainer should recognise it?
      options:
        - cors-error-explainer
        - esm-cjs-explainer
        - npm-eresolve-explainer
        - chunk-cache-explainer
        - database-url-doctor
        - database-connection-explainer
        - build-error-decoder
        - Not sure
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Exact error text
      description: Copy it exactly as printed, including the lines around it. No paraphrase, no screenshot.
      render: text
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command that produced it
      placeholder: "npm install / next build / node index.js / browser console on page load"
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Tool versions
      description: Node.js, npm/pnpm/yarn, framework (Next.js…), browser — whatever applies.
      placeholder: |
        node 22.12.0
        npm 10.9.0
        next 15.5.4
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15 / Ubuntu 24.04 / Windows 11"
  - type: input
    id: source
    attributes:
      label: Source link
      description: A Stack Overflow question, GitHub issue or doc page where this error appears, if any.
      placeholder: https://
