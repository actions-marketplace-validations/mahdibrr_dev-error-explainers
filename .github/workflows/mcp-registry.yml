name: mcp-registry

# Publishes server.json to the official MCP Registry with GitHub OIDC (no stored token).
# Runs after a GitHub release is published (npm must already have the version) or by hand.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4
      - name: Check server.json matches package.json and npm
        run: |
          v="$(node -p "require('./package.json').version")"
          s="$(node -p "require('./server.json').version")"
          [ "$v" = "$s" ] || { echo "server.json $s != package.json $v" >&2; exit 1; }
          npm view "dev-error-explainers@$v" mcpName
      - name: Install mcp-publisher (checksum-verified)
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}"
          curl -fsSLO "$base/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "$base/registry_${PUBLISHER_VERSION#v}_checksums.txt"
          grep " mcp-publisher_linux_amd64.tar.gz$" "registry_${PUBLISHER_VERSION#v}_checksums.txt" | sha256sum -c -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
