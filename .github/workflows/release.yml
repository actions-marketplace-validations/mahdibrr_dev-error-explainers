name: release

# Publishes to npm when a version tag (v*) is pushed, using npm Trusted Publishing
# (OIDC): no NPM_TOKEN secret, provenance generated automatically.
#
# npm only lets a trusted publisher be configured on a package that already
# exists, so the very first version is published once by hand; after that the
# trusted publisher (GitHub Actions, workflow "release.yml") is set on npmjs.com
# and every release is a tag push. A tag whose version is already on the
# registry is tested but not re-published.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm >= 11.5.1
        run: npm install -g npm@latest
      - name: Tag matches package.json version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package.json version $version" >&2
            exit 1
          fi
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published == 'false'
        run: npm ci --no-audit --no-fund
      - if: steps.version.outputs.published == 'false'
        run: npm test
      - if: steps.version.outputs.published == 'false'
        run: npm publish --provenance --access public
